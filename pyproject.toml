[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "postgresfs-vs-skill"
version = "0.1.0"
description = "PostgresFS vs SQL Skill benchmark for AI agents"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
